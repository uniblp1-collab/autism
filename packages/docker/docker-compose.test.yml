# Отдельная БД для e2e-тестов backend (ARCHITECTURE.md §6), не пересекается с dev-данными.
# Запуск: docker compose -f packages/docker/docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autism_connect_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
