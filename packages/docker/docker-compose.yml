services:
  postgres:
    image: postgres:16
    container_name: autism-connect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autism_connect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: autism-connect-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Современный MinIO не реализует per-bucket CORS API (PutBucketCors/`mc cors set` оба
      # падают с "NotImplemented") — CORS настраивается только так, на уровне всего сервера.
      # Нужно, чтобы CardButton мог прочитать пиксели картинки через <canvas> (определение
      # светлая/тёмная картинка для инверсии цвета подписи) — без CORS-заголовков сама картинка
      # всё равно отображается, просто без этого эффекта.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовый контейнер: включает публичное чтение бакета через сам `mc` (официальный CLI
  # MinIO), а не через @aws-sdk/client-s3 из бэкенда — SDK начиная с версий с "flexible
  # checksums" безусловно добавляет заголовок x-amz-sdk-checksum-algorithm на PutBucketPolicy
  # (этот вызов помечен в модели S3 как requestChecksumRequired), а MinIO отвечает на него
  # "NotImplemented". `mc` этой проблеме не подвержен, поэтому настройка бакета вынесена сюда.
  createbuckets:
    image: minio/mc
    container_name: autism-connect-minio-init
    depends_on:
      # Не condition: service_healthy — здоровье minio у некоторых образов проверяется через
      # curl, которого в свежих образах minio/minio может не быть, и тогда healthcheck никогда
      # не станет "healthy", хотя сам сервис уже отвечает на запросы (см. ретрай ниже, который
      # проверяет готовность напрямую через mc, а не полагается на Docker-healthcheck).
      minio:
        condition: service_started
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done &&
      mc mb --ignore-existing local/autism-connect-cards &&
      mc anonymous set download local/autism-connect-cards
      "

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: autism-connect-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      # Не condition: service_healthy для minio — то же самое ограничение, что и у
      # createbuckets выше (healthcheck через curl может никогда не стать "healthy" на новых
      # образах minio/minio). StorageService на бэкенде и так переживает временную
      # недоступность MinIO без падения (см. storage.service.ts), а фактической готовности
      # бакета дожидается createbuckets — этого достаточно для порядка запуска.
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    ports:
      - "3001:3000"

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      # NEXT_PUBLIC_* встраивается Next.js на этапе build, а не только в рантайм-окружение
      # контейнера — `environment:` ниже недостаточно (см. apps/frontend/Dockerfile).
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
        NEXT_PUBLIC_EDIT_MODE_ENABLED: "true"
    container_name: autism-connect-frontend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_EDIT_MODE_ENABLED: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
