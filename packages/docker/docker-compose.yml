services:
  postgres:
    image: postgres:16
    container_name: autism-connect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autism_connect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: autism-connect-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовый контейнер: создаёт бакет, включает публичное чтение и CORS через сам `mc`
  # (официальный CLI MinIO), а не через @aws-sdk/client-s3 из бэкенда — SDK начиная с версий с
  # "flexible checksums" безусловно добавляет заголовок x-amz-sdk-checksum-algorithm на
  # PutBucketPolicy/PutBucketCors (эти два вызова помечены в модели S3 как
  # requestChecksumRequired), а MinIO отвечает на него "NotImplemented". `mc` этой проблеме не
  # подвержен, поэтому настройка бакета вынесена сюда — StorageService на бэкенде оставляет свои
  # попытки лишь как best-effort fallback (см. комментарий в storage.service.ts).
  createbuckets:
    image: minio/mc
    container_name: autism-connect-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio-cors.xml:/cors.xml:ro
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/autism-connect-cards &&
      mc anonymous set download local/autism-connect-cards &&
      mc cors set local/autism-connect-cards /cors.xml
      "

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: autism-connect-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    ports:
      - "3001:3000"

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      # NEXT_PUBLIC_* встраивается Next.js на этапе build, а не только в рантайм-окружение
      # контейнера — `environment:` ниже недостаточно (см. apps/frontend/Dockerfile).
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
        NEXT_PUBLIC_EDIT_MODE_ENABLED: "true"
    container_name: autism-connect-frontend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_EDIT_MODE_ENABLED: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
