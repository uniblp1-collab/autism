services:
  postgres:
    image: postgres:16
    container_name: autism-connect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autism_connect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: autism-connect-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      # Картинки карточек хранятся на диске (см. storage.service.ts) — volume нужен, чтобы
      # файлы переживали пересоздание контейнера, а не только рестарт.
      - uploads:/app/uploads

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      # NEXT_PUBLIC_* встраивается Next.js на этапе build, а не только в рантайм-окружение
      # контейнера — `environment:` ниже недостаточно (см. apps/frontend/Dockerfile).
      # NEXT_PUBLIC_API_URL больше не нужен: браузер ходит на относительный /api/... (rewrites).
      args:
        NEXT_PUBLIC_EDIT_MODE_ENABLED: "true"
    container_name: autism-connect-frontend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Адрес backend внутри compose-сети — сервер Next.js проксирует на него /api/... (rewrites).
      # Runtime-переменная (не build arg): rewrites() вычисляются при старте standalone-сервера.
      BACKEND_INTERNAL_URL: http://backend:3000
      NEXT_PUBLIC_EDIT_MODE_ENABLED: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
